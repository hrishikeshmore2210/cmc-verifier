[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmc-verifier"
version = "0.5.0"
description = "Multi-agent verification of CMC dossier claims against source CoA/spec data"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "pydantic>=2",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
llm = ["anthropic>=2.8"]
dev = ["anthropic>=2.8", "pytest>=8", "hypothesis>=6", "reportlab>=4", "ruff>=0.5"]

[project.scripts]
cmc-verify = "cmc_verifier.cli:main"

[tool.setuptools.packages.find]
include = ["cmc_verifier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["graphify-out", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E702", "E731"]
