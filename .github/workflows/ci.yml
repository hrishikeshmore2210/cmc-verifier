name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Eval gate (per-check precision/recall must not regress)
        run: python -m cmc_verifier.evals --min-precision 1 --min-recall 1
      - name: Verify audit ledger from a real run
        run: |
          python run.py --audit "$RUNNER_TEMP/audit.jsonl" --fail-on none --sarif "$RUNNER_TEMP/out.sarif" > /dev/null
          python -m cmc_verifier.audit "$RUNNER_TEMP/audit.jsonl"
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: sarif
          path: ${{ runner.temp }}/out.sarif

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t cmc-verifier:ci .
      - name: Smoke test container
        run: docker run --rm cmc-verifier:ci --fail-on none
